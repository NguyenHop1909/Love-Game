name: Tổng kết phiếu của tụi mình
on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 16 28-31 * *'
  workflow_dispatch:
    inputs:
      period:
        description: Kỳ tổng kết
        type: choice
        options: [day, month]
        default: day
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/summary.js
        env:
          SUMMARY_PERIOD: ${{ inputs.period }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_USER_CHAT_ID: ${{ secrets.TELEGRAM_USER_CHAT_ID }}
